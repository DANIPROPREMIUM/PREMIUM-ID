<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PREMIUM ID</title>
<link rel="stylesheet" href="popup.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="premium-container">
    
    <!-- ===== HEADER ===== -->
    <div class="premium-header">
        <div class="premium-title">
            <span class="premium-text">PREMIUM</span>
            <div class="id-wrapper">
                <span class="id-text">ID</span>
                <i class="fas fa-crown crown-icon tilted"></i>
            </div>
        </div>
        <div class="creator-subtitle">ACCESO GRATUITO</div>
    </div>
    
    <!-- ===== GRID DE 4x4 ===== -->
    <div class="platforms-grid">
        <div class="platform-card netflix" data-platform="netflix" title="Netflix">
            <div class="platform-icon">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/netflix.svg" alt="Netflix">
            </div>
        </div>
        
        <div class="platform-card crunchyroll" data-platform="crunchyroll" title="Crunchyroll">
            <div class="platform-icon">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/crunchyroll.svg" alt="Crunchyroll">
            </div>
        </div>
        
        <div class="platform-card prime" data-platform="prime" title="Prime Video">
            <div class="platform-icon">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/primevideo.svg" alt="Prime Video">
            </div>
        </div>
        
        <div class="platform-card paramount" data-platform="paramount" title="Paramount+">
            <div class="platform-icon">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/paramountplus.svg" alt="Paramount+">
            </div>
        </div>
        
        <div class="platform-card viki" data-platform="viki" title="Rakuten Viki">
            <div class="platform-icon">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/rakuten.svg" alt="Viki">
            </div>
        </div>
        
        <div class="platform-card atresplayer" data-platform="atresplayer" title="AtresPlayer">
            <div class="platform-icon atres-text-logo">
                <span class="atres-red">ATRES</span><span class="player-gray">player</span>
            </div>
        </div>

        <div class="platform-card hbomax" data-platform="hbomax" title="HBO Max">
            <div class="platform-icon">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/hbomax.svg" alt="HBO Max">
            </div>
        </div>

        <div class="platform-card appletv" data-platform="appletv" title="Apple TV">
            <div class="platform-icon">
                <i class="fab fa-apple" style="font-size: 26px; color: #888;"></i>
            </div>
        </div>
    </div>
    
    <!-- ===== BOTÓN LIMPIAR COOKIES DE HBO MAX ===== -->
    <div id="hbomax-cleaner" class="hbomax-cleaner">
        <button id="clean-hbomax-cookies" class="clean-btn">
            <i class="fas fa-trash-alt"></i>
            Limpiar cookies de HBO Max
        </button>
        <span class="clean-info">Útil si HBO Max no carga o da error de redirección</span>
    </div>

    <!-- ===== PANEL NETFLIX: INGRESAR / 2 TOKENS (TELÉFONO / TV) ===== -->
    <div id="netflix-tokens" class="netflix-tokens hidden">
        <div class="nt-header">
            <span class="nt-title"><i class="fas fa-ticket-alt"></i> Netflix</span>
            <button id="nt-ingresar" class="nt-ingresar hidden">
                <i class="fas fa-sign-in-alt"></i> Ingresar
            </button>
        </div>
        <span class="nt-note">Web no reproduce en Android → usá un token</span>
        <div id="nf-tokens-list" class="nf-tokens-list hidden">
            <div class="nt-row" data-ntk="phone">
                <span class="nt-name">📱 Teléfono</span>
                <div class="nt-actions">
                    <button class="nt-btn ir" data-ntk="phone">Ir</button>
                    <button class="nt-btn cp" data-ntk="phone">Copiar</button>
                </div>
            </div>
            <div class="nt-row" data-ntk="desktop">
                <span class="nt-name">🖥 Desktop</span>
                <div class="nt-actions">
                    <button class="nt-btn ir" data-ntk="desktop">Ir</button>
                    <button class="nt-btn cp" data-ntk="desktop">Copiar</button>
                </div>
            </div>
            <div class="nt-row" data-ntk="tv">
                <span class="nt-name">📺 TV</span>
                <div class="nt-actions">
                    <button class="nt-btn ir" data-ntk="tv">Ir</button>
                    <button class="nt-btn cp" data-ntk="tv">Copiar</button>
                </div>
            </div>
            <button id="nt-regenerar" class="nt-regenerar">↻ Regenerar tokens</button>
        </div>
        <div id="nf-status" class="nf-status"></div>
    </div>
    
    <!-- ===== STATUS ===== -->
    <div id="status-message" class="status-message"></div>
    
    <!-- ===== FOOTER ===== -->
    <div class="premium-footer">
        <span class="version">v10.0</span>
    </div>
</div>
<script src="popup.js"></script>
</body>
</html>
